# Quarry dev environment. mise applies this when you cd here (mise activate zsh).
# Paths are relative to this file, so nothing here is machine-specific.
[tools]
node = "24"
python = "3.11"
rust = "stable"

[env]
QUARRY_HOME = "{{config_root}}"
QUARRY_DB   = "{{config_root}}/vault.db"
# A .git-free COPY of the vault (made by dev.sh setup), never the real vault.
VAULT_PATH  = "{{config_root}}/../quarry-data/knowledge"
